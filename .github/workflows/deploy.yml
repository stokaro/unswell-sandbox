name: Deploy

on:
  push:
    branches: [main]
  # A pull request runs the check job and stops there. Everything the check
  # asserts -- that the CNAME is right, that every reference resolves, that the
  # committed manifest still describes the pinned Unswell -- is worth knowing
  # before a merge, and a pull request must never publish.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The pin is a checked-in file, so this job needs nothing but the
      # checkout to compare the manifest against it.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web

      # The unit suite is the renderer's arithmetic -- UTF-8 byte offsets onto
      # UTF-16 indices, and the score bands. No wasm, so it runs here.
      - name: Unit tests
        run: npm run test:unit
        working-directory: web

      # The bundle has to exist before the link check, because the page loads
      # dist/*.js and a missing bundle is exactly the kind of break this gate is
      # for.
      - name: Bundle
        run: npm run build
        working-directory: web

      # CNAME, index.html and 404.html present, every href/src and every CSS
      # url() resolving to a real file, the font licenses beside the fonts, no
      # github.io address, and the committed manifest naming the commit
      # third_party/unswell.pin records. --no-wasm because this job does not
      # link the binary; the deploy job runs the same script without it, so the
      # binary is never unchecked.
      - name: The site is publishable
        run: node web/scripts/check-site.mjs --root web --no-wasm

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The engine is not a submodule. third_party/unswell.pin names the
      # commit, and scripts/build-wasm.sh fetches exactly that commit into a
      # blobless mirror, so this checkout carries only the sandbox.
      - uses: actions/checkout@v7

      - name: Read the Unswell pin
        id: pin
        run: |
          set -euo pipefail
          pin=third_party/unswell.pin
          field() { awk -v key="$1" '$1 == key { $1 = ""; sub(/^ /, ""); print; exit }' "$pin"; }
          sha="$(field commit)"
          version="$(field version)"
          if [ -z "$sha" ] || [ -z "$version" ]; then
            echo "::error::$pin is missing its commit or version line"
            exit 1
          fi
          case "$version" in
            v*) ;;
            *)
              echo "::error::$pin records version '$version', which is not a tag description."
              echo "::error::The build would stamp that as the version the page shows."
              exit 1
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Unswell $version ($sha)"

      # The wasm itself, keyed on everything that decides its bytes: the pin,
      # the Go sources overlaid onto it, any upstream patch, and the build
      # script. No restore-keys -- a near miss here would restore a binary built
      # from different sources, which is worse than a slow build.
      - name: Restore the built wasm
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: web/vendor/unswell
          key: wasm-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ hashFiles('runtime/**', 'upstream-patch/**', 'scripts/build-wasm.sh', 'scripts/unswell-git.sh', 'scripts/catalog/**') }}

      - uses: actions/setup-go@v7
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: .go-version
          # Cached below instead, keyed on the pin rather than on go.sum, so a
          # runtime/ change reuses the compiled standard library and the whole
          # of Unswell's dependency tree.
          cache: false

      - name: Restore the Go build cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ hashFiles('runtime/**') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.pin.outputs.sha }}-
            go-${{ runner.os }}-

      - name: Build unswell.wasm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: make wasm

      - name: Reuse the cached wasm
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          echo "The pin has not moved and no Go source changed; reusing the cached build."
          ls -l web/vendor/unswell

      # A cached or freshly linked binary is checked the same way: the manifest
      # in the artifact must describe the binary in the artifact, and both must
      # name the commit this repository pins. A stale cache entry, a truncated
      # restore or a hand-edited manifest all land here.
      - name: The build agrees with what is committed
        run: |
          set -euo pipefail
          git show HEAD:web/vendor/unswell/manifest.json > /tmp/committed-manifest.json
          git show HEAD:web/vendor/unswell/wasm_exec.js > /tmp/committed-wasm_exec.js

          identity='{unswellVersion,unswellCommit,unswellCommitDate,goVersion,wasmExec,rules}'
          if ! diff -u \
            <(jq -S "$identity" /tmp/committed-manifest.json) \
            <(jq -S "$identity" web/vendor/unswell/manifest.json); then
            echo "::error file=web/vendor/unswell/manifest.json::The build does not match the committed manifest."
            echo "::error file=web/vendor/unswell/manifest.json::Run \`make wasm\` locally and commit web/vendor/unswell/{manifest.json,wasm_exec.js}."
            exit 1
          fi

          # wasm_exec.js is copied verbatim out of GOROOT and has to match the
          # toolchain that linked the binary. Byte-identical or the pair is
          # mismatched, which fails at runtime with no useful message.
          if ! cmp -s /tmp/committed-wasm_exec.js web/vendor/unswell/wasm_exec.js; then
            echo "::error file=web/vendor/unswell/wasm_exec.js::differs from the one this toolchain produced"
            exit 1
          fi

          # A js/wasm link is not byte-reproducible: the linker embeds a build id
          # derived from paths and build metadata, so two builds of identical
          # source differ even on the same host. A difference here is therefore
          # reported, not fatal. The identity check above is what gates the
          # deploy.
          want="$(jq -r .wasm.sha256 /tmp/committed-manifest.json)"
          got="$(jq -r .wasm.sha256 web/vendor/unswell/manifest.json)"
          if [ "$want" != "$got" ]; then
            echo "::warning::unswell.wasm built here hashes to $got; the committed manifest recorded $want. Same sources, different bytes."
          else
            echo "unswell.wasm is byte-identical to the locally built one ($got)."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Bundle
        run: npm run build
        working-directory: web

      # The engine, driven outside a browser: the host contract, then the three
      # sample documents through the real rule catalog. It runs here rather than
      # in the check job because it needs the linked binary.
      - name: The engine answers, and the samples still mean what the page says
        run: make test

      # Stage exactly what ships. web/ also holds the build inputs -- sources,
      # node_modules, the bundler config, the CI checks -- and none of them
      # belong in a public artifact. A denylist rather than an allowlist, so a
      # page added to web/ ships without anyone remembering to edit this. Note
      # that web/scripts/ is dropped: it is for tooling, not for anything the
      # browser loads. A page that referenced something in there would pass the
      # check job and fail the staged check below, which is the intent.
      - name: Stage the site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R web _site
          rm -rf \
            _site/node_modules \
            _site/src \
            _site/scripts \
            _site/build.mjs \
            _site/tsconfig.json \
            _site/package.json \
            _site/package-lock.json
          test ! -e _site/node_modules
          du -sh _site
          find _site -maxdepth 1 -mindepth 1 | sort

      # The same checker the check job ran, this time against the directory that
      # is about to be uploaded and with nothing exempt: the binary is present,
      # so its sha256 and byte count are compared to the manifest.
      - name: The staged site is publishable
        run: node web/scripts/check-site.mjs --root _site

      - name: The artifact fits GitHub Pages
        run: |
          set -euo pipefail
          bytes="$(du -sb _site | cut -f1)"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.0f", b / 1048576 }')"
          echo "_site is $mib MiB"
          {
            echo "### Artifact"
            echo
            echo "\`_site\` is **$mib MiB**, against a 1 GB GitHub Pages site limit."
          } >> "$GITHUB_STEP_SUMMARY"
          # 1 GB is the documented Pages limit; stop well short of it rather
          # than discover it during an upload.
          if [ "$bytes" -gt 900000000 ]; then
            echo "::error::_site is $mib MiB, over the 900 MiB ceiling this workflow enforces"
            exit 1
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Smoke test the deployment
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Only the checked-in scripts and the pin are needed; the engine's own
      # sources are not.
      - uses: actions/checkout@v7

      # Fetches the live site and asserts it is the build this run produced: 200
      # on the root, the site's own 404 page on an unknown address, the bundle
      # and the samples present, application/wasm on the binary, and the sha256
      # of the bytes the CDN actually returned against the manifest the same
      # origin serves. It also measures whether Pages compresses a 46 MB asset,
      # which decides whether a cold visit costs 21 MiB or 46 MiB.
      - name: Fetch play.unswell.dev and measure it
        run: |
          set -euo pipefail
          pin="$(awk '$1 == "commit" { print $2; exit }' third_party/unswell.pin)"
          sh web/scripts/smoke.sh https://play.unswell.dev/ "$pin"
